AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Worko Referral Source Candidate Profile Parser Lambda

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.10

Resources:
  ReferralSourceCandProfileParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource: "*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "*"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueUrl
                Resource: "*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  PythonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "worko-referral-source-cand-profile-parser-deps-${Environment}"
      Description: Python dependencies for referral source candidate profile parser lambda
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.10
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.10
      BuildArchitecture: x86_64

  ReferralSourceCandProfileParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-referral-source-cand-profile-parser-${Environment}"
      CodeUri: ./
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ReferralSourceCandProfileParserRole.Arn
      Layers:
        - !Ref PythonDependenciesLayer
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          SQS_REGION: ap-south-1
          EVENT_QUEUE_NAME: worko-corp-app-event-queue
          CV_UPLOAD_BUCKET: !Sub "worko-corporate-referral-source-cv-${Environment}"
          SES_SOURCE_EMAIL: no-reply@worko.ai
          COMPANY_ID_PATTERN: !If [IsProd, "@referral\\.worko\\.ai", "@referral\\.worko\\.work"]

  LambdaInvokePermissionReferralEmail:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReferralSourceCandProfileParserFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::worko-referral-email-${Environment}"

Outputs:
  ReferralSourceCandProfileParserFunctionArn:
    Description: Referral Source Candidate Profile Parser Lambda Function ARN
    Value: !GetAtt ReferralSourceCandProfileParserFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReferralSourceCandProfileParserFunctionArn"
  
  ReferralSourceCandProfileParserRoleArn:
    Description: Lambda Execution Role ARN (needed for KMS key policy)
    Value: !GetAtt ReferralSourceCandProfileParserRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ReferralSourceCandProfileParserRoleArn"
