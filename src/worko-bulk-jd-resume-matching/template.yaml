AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Worko Bulk JD Resume Matching Lambda Function

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name (dev, staging, prod)

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.11

Resources:
  WorkoBulkJdResumeMatchingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'worko-bulk-jd-resume-matching-${Environment}'
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Layers:
        - !Ref WorkoBulkJdResumeMatchingDepsLayer
        - !Ref SharedCoreLayer
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          table_name: worko
          queue_name: worko-app-event-queue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub 'arn:aws:s3:::worko-app-${Environment}/*'
                - !Sub 'arn:aws:s3:::worko-corporate-${Environment}/*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/worko'
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:worko-app-event-queue'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: "*"

  WorkoBulkJdResumeMatchingDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'worko-bulk-jd-resume-matching-deps-${Environment}'
      Description: Dependencies for Worko Bulk JD Resume Matching Lambda
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.11

  SharedCoreLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "worko-shared-core-${Environment}"
      Description: Shared core business logic for JD-Resume matching
      ContentUri: ../shared-core-layer/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.11

  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkoBulkJdResumeMatchingFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::worko-app-${Environment}'

Outputs:
  WorkoBulkJdResumeMatchingFunction:
    Description: Worko Bulk JD Resume Matching Lambda Function ARN
    Value: !GetAtt WorkoBulkJdResumeMatchingFunction.Arn
  WorkoBulkJdResumeMatchingFunctionName:
    Description: Worko Bulk JD Resume Matching Lambda Function Name
    Value: !Ref WorkoBulkJdResumeMatchingFunction