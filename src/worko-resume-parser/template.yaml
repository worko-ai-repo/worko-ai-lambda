AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Worko AI Lambda - Resume Parser Function

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Globals:
  Function:
    Timeout: 120
    MemorySize: 512
    Runtime: python3.10

Resources:
  ResumeParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "*"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                Resource: "*"

  PythonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "resume-parser-deps-${Environment}"
      Description: Python dependencies for worko resume parser lambda
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.10
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.10

  SharedCoreLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "worko-shared-core-${Environment}"
      Description: Shared core business logic for JD-Resume matching
      ContentUri: ../shared-core-layer/
      CompatibleRuntimes:
        - python3.10
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.10

  ResumeParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-resume-parser-${Environment}"
      CodeUri: ./
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ResumeParserRole.Arn
      Layers:
        - !Ref PythonDependenciesLayer
        - !Ref SharedCoreLayer
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          S3_BUCKET_NAME: !Sub "worko-app-${Environment}"
          DYNAMO_TABLE_NAME: "worko"


Outputs:
  ResumeParserFunctionArn:
    Description: Resume Parser Lambda Function ARN
    Value: !GetAtt ResumeParserFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ResumeParserFunctionArn"