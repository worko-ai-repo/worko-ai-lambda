AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Worko Candidate Profile Parser - Step 1 (Download CVs)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Resources:
  CandProfileParserStep1Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub worko-cand-profile-parser-step1-${Environment}
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      CodeUri: .
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Policies:
        - S3FullAccessPolicy:
            BucketName: !Sub worko-*-${Environment}
        - Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: '*'
      Layers:
        - !Ref PythonDependenciesLayer

  PythonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub worko-cand-profile-parser-step1-deps-${Environment}
      Description: Python dependencies for Step 1
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.11
    Metadata:
      BuildMethod: python3.11

Outputs:
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt CandProfileParserStep1Function.Arn
  FunctionName:
    Description: Lambda Function Name
    Value: !Ref CandProfileParserStep1Function
