AWSTemplateFormatVersion: '2010-09-09'
Description: SQS Queue for State Machine Retry

Parameters:
  Environment:
    Type: String
    Description: Environment name (dev, staging, prod)
    Default: dev

Resources:
  StateMachineRetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'state-machine-retry-${Environment}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 0

  StateMachineRetryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref StateMachineRetryQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt StateMachineRetryQueue.Arn

Outputs:
  QueueUrl:
    Description: URL of the SQS Queue
    Value: !Ref StateMachineRetryQueue
  QueueArn:
    Description: ARN of the SQS Queue
    Value: !GetAtt StateMachineRetryQueue.Arn
