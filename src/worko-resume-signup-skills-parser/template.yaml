AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Worko Resume Signup Skills Parser Lambda

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Globals:
  Function:
    Timeout: 120
    MemorySize: 512
    Runtime: python3.10

Resources:
  ResumeSignupSkillsParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "*"

  PythonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "worko-resume-signup-skills-parser-deps-${Environment}"
      Description: Python dependencies for worko resume signup skills parser lambda
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.10
    Metadata:
      BuildMethod: python3.10

  ResumeSignupSkillsParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-resume-signup-skills-parser-${Environment}"
      CodeUri: ./
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ResumeSignupSkillsParserRole.Arn
      Layers:
        - !Ref PythonDependenciesLayer
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          S3_BUCKET_NAME: !Sub "worko-app-${Environment}"
          DYNAMO_TABLE_NAME: "worko"
          AZURE_OPENAI_ENDPOINT: "https://aif-wrk-dev-sin-01.openai.azure.com"
          AZURE_OPENAI_DEPLOYMENT: "gpt-4o"
          AZURE_OPENAI_API_KEY: "REDACTED"
          AZURE_OPENAI_API_VERSION: "2025-01-01-preview"

Outputs:
  ResumeSignupSkillsParserFunctionArn:
    Description: Resume Signup Skills Parser Lambda Function ARN
    Value: !GetAtt ResumeSignupSkillsParserFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ResumeSignupSkillsParserFunctionArn"