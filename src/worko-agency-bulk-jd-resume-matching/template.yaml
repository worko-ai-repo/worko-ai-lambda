AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Worko Agency Bulk JD Resume Matching Lambda

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Globals:
  Function:
    Timeout: 180
    MemorySize: 512
    Runtime: python3.10

Resources:
  AgencyBulkLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "*"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueUrl
                Resource: "*"

  PythonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "worko-agency-bulk-jd-resume-matching-deps-${Environment}"
      Description: Python dependencies for agency bulk JD resume matching lambda
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.10
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.10
      BuildArchitecture: x86_64

  SharedCoreLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "worko-shared-core-${Environment}"
      Description: Shared core business logic for JD-Resume matching
      ContentUri: ../shared-core-layer/
      CompatibleRuntimes:
        - python3.10
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.10

  AgencyBulkJdResumeMatchingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-agency-bulk-jd-resume-matching-${Environment}"
      CodeUri: ./
      Handler: lambda_function.lambda_handler
      Role: !GetAtt AgencyBulkLambdaRole.Arn
      Layers:
        - !Ref PythonDependenciesLayer
        - !Ref SharedCoreLayer
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment


Outputs:
  AgencyBulkJdResumeMatchingFunctionArn:
    Description: Agency Bulk JD Resume Matching Lambda Function ARN
    Value: !GetAtt AgencyBulkJdResumeMatchingFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AgencyBulkJdResumeMatchingFunctionArn"