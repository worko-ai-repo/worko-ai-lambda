AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Worko Agency Bulk JD Resume Matching Lambda

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Globals:
  Function:
    Timeout: 180
    MemorySize: 512
    Runtime: python3.10

Resources:
  AgencyBulkLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "*"

  PythonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "worko-agency-bulk-jd-resume-matching-deps-${Environment}"
      Description: Python dependencies for agency bulk JD resume matching lambda
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.10
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.10
      BuildArchitecture: x86_64

  AgencyBulkJdResumeMatchingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "worko-agency-bulk-jd-resume-matching-${Environment}"
      CodeUri: ./
      Handler: lambda_function.lambda_handler
      Role: !GetAtt AgencyBulkLambdaRole.Arn
      Layers:
        - !Ref PythonDependenciesLayer
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          AZURE_OPENAI_ENDPOINT: "https://aif-wrk-dev-sin-01.openai.azure.com"
          AZURE_OPENAI_DEPLOYMENT: "gpt-4o"
          AZURE_OPENAI_API_KEY: "REDACTED"
          AZURE_OPENAI_API_VERSION: "2025-01-01-preview"
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket: !Sub "worko-app-${Environment}"
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: agencies/
                  - Name: suffix
                    Value: .pdf

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgencyBulkJdResumeMatchingFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::worko-app-${Environment}"

Outputs:
  AgencyBulkJdResumeMatchingFunctionArn:
    Description: Agency Bulk JD Resume Matching Lambda Function ARN
    Value: !GetAtt AgencyBulkJdResumeMatchingFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AgencyBulkJdResumeMatchingFunctionArn"