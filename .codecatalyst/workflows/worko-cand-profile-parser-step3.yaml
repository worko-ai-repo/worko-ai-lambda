Name: worko-cand-profile-parser-step3-deploy
SchemaVersion: "1.0"

Triggers:
  - Type: Push
    Branches:
      - main

Actions:
  DeployLambda:
    Identifier: aws/build@v1
    Inputs:
      Sources:
        - WorkflowSource
    Configuration:
      Steps:
        - Run: echo "Loading environment configuration..."
        - Run: |
            export ENVIRONMENT=$(cat env-config.json | grep -o '"ENVIRONMENT"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4)
            export AWS_REGION=$(cat env-config.json | grep -o '"AWS_REGION"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4)
            export S3_BUCKET_MANAGED=$(cat env-config.json | grep -o '"S3_BUCKET_MANAGED"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4)
            echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
            echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
            echo "S3_BUCKET_MANAGED=$S3_BUCKET_MANAGED" >> $GITHUB_ENV
            echo "Environment: $ENVIRONMENT"
            echo "Region: $AWS_REGION"
            echo "S3 Bucket: $S3_BUCKET_MANAGED"
        - Run: cd src/worko-cand-profile-parser-step3
        - Run: sam build --use-container
        - Run: sam deploy --stack-name worko-cand-profile-parser-step3-${ENVIRONMENT}-stack --region ${AWS_REGION} --capabilities CAPABILITY_IAM --parameter-overrides Environment=${ENVIRONMENT} --no-fail-on-empty-changeset --resolve-s3
    Environment:
      Name: worko-dev
      Connections:
        - Name: "123456789012"
          Role: CodeCatalystWorkflowDevelopmentRole-worko-ai
